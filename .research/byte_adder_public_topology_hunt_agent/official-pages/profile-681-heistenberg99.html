<script>
    "use strict";

    function compare() {
        let elements = document.getElementsByClassName("toggle");
        for (var i = 0; i < elements.length; i++) {
            elements[i].style.display = elements[i].style.display == "inline" ? "none" : "inline";
        }
    }

    let sort_frontiers = (() => {
        var criterion, is_ascending;
        return (key) => {
            if (criterion === key) {
                is_ascending = !is_ascending;
            } else {
                criterion = key;
                is_ascending = true;
            }

            console.log(criterion, is_ascending);

            for (var i = 0; i < 3; i++) {
                document.getElementById(i + "_asc").style.display = "none";
                document.getElementById(i + "_dsc").style.display = "none";
            }
            document.getElementById(criterion + "_" + (is_ascending ? "asc" : "dsc")).style.display = "inline";

            var cmp_f = (a, b) => a.value - b.value;
            if (!is_ascending) {
                cmp_f = (a, b) => b.value - a.value;
            }

            let table = document.getElementById("frontiers");
            let num_row = table.rows.length;
            for (var i = 1; i < num_row; i++) {
                let stats = table.rows[i].getElementsByTagName("td");
                let divs = stats[1 + criterion].getElementsByTagName("div");
                var items = []
                for (var j = 0; j < divs.length; j++) {
                    items[j] = {
                        value: parseInt(divs[j].getElementsByTagName("span")[0].textContent.replace(/[^0-9]/g, "")),
                        index: j,
                    };
                }
                items.sort(cmp_f);

                for (var j = 1; j < stats.length; j++) {
                    let divs = stats[j].getElementsByTagName("div");
                    for (var k = 0; k < divs.length; k++) {
                        items[k].value = divs[items[k].index];
                    }
                    for (var k = items.length - 1; k >= 0; k--) {
                        stats[j].insertBefore(items[k].value, stats[j].firstElementChild);
                    }
                }
            }
        }
    })();
</script>
