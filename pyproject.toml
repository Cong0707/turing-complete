[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-save-lab"
version = "0.1.0"
description = "Offline, version-controlled Turing Complete save and circuit laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Turing Complete Save Lab contributors" }]
dependencies = []

[project.scripts]
tc-save = "tc_save_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
