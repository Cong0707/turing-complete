[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-save-lab"
version = "0.1.0"
description = "离线、可版本管理的图灵完备存档与电路实验室"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "图灵完备存档实验室贡献者" }]
dependencies = []

[project.scripts]
tc-save = "tc_save_lab.cli:main"
tc-foundry = "tc_save_lab.foundry_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
